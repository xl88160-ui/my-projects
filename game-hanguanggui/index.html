<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>寒光龟 · 恐龙跑酷</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#bde9ff}body{touch-action:none}canvas{display:block;width:100vw;height:100vh}.tip{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 14px;border-radius:20px;background:#ffffffaa;backdrop-filter:blur(6px);font-weight:700;color:#25323a;pointer-events:none}@media(min-width:700px){.tip{bottom:25px}}</style></head><body><canvas id="c"></canvas><div class="tip">点击 / 触摸屏幕跳跃　·　再次点击可二段跳</div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,ground,player,obs,poop,clouds,score,best=+localStorage.hanguangBest||0,speed,over,started,timer,last=0;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);ground=H*.78;if(player)player.y=Math.min(player.y,ground-55)}addEventListener('resize',resize);
function reset(){player={x:W*.16,y:ground-55,vy:0,jumps:0};obs=[];poop=[];clouds=[];score=0;speed=7;over=false;started=true;timer=0;for(let i=0;i<7;i++)clouds.push({x:Math.random()*W,y:50+Math.random()*H*.28,s:25+Math.random()*45})}resize();reset();
function jump(){if(over){reset();return}started=true;if(player.jumps<2){player.vy=-13;player.jumps++}}
addEventListener('pointerdown',jump);addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')jump()});
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function spawn(){let h=25+Math.random()*42,w=20+Math.random()*22;obs.push({x:W+30,y:ground-h,w,h})}
function rain(){poop.push({x:Math.random()*W,y:-20,vy:4+Math.random()*4,s:7+Math.random()*8})}
function drawDino(){let p=player;x.fillStyle='#59656b';x.beginPath();x.ellipse(p.x+28,p.y+35,27,19,0,0,Math.PI*2);x.fill();x.fillRect(p.x+40,p.y+18,22,22);x.beginPath();x.arc(p.x+62,p.y+16,15,0,Math.PI*2);x.fill();x.fillStyle='#20272b';x.fillRect(p.x+69,p.y+10,3,3);x.fillStyle='#59656b';x.fillRect(p.x+14,p.y+49,7,13);x.fillRect(p.x+38,p.y+49,7,13);x.beginPath();x.moveTo(p.x+4,p.y+33);x.lineTo(p.x-18,p.y+20);x.lineTo(p.x+5,p.y+27);x.fill();x.fillStyle='#f0d36b';x.font='bold 13px sans-serif';x.textAlign='center';x.fillText('寒光龟',p.x+34,p.y-8)}
function draw(){x.clearRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#a9ddff');sky.addColorStop(1,'#e9f8ff');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#ffffff88';clouds.forEach(q=>{x.beginPath();x.arc(q.x,q.y,q.s*.45,0,7);x.arc(q.x+q.s*.45,q.y+5,q.s*.35,0,7);x.arc(q.x-q.s*.4,q.y+7,q.s*.32,0,7);x.fill()});x.fillStyle='#6db36b';x.fillRect(0,ground,W,H-ground);x.fillStyle='#4c8e4c';for(let i=0;i<W;i+=28)x.fillRect(i,ground+8,14,3);poop.forEach(q=>{x.strokeStyle='#75502d';x.lineWidth=3;x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x-2,q.y+q.s*2);x.stroke();x.fillStyle='#76502d';x.beginPath();x.arc(q.x-2,q.y+q.s*2,q.s*.8,0,7);x.fill()});obs.forEach(o=>{x.fillStyle='#355d36';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#244728';x.fillRect(o.x+5,o.y-7,4,7);x.fillRect(o.x+o.w-8,o.y-5,4,5)});drawDino();x.fillStyle='#23343b';x.textAlign='left';x.font='bold 20px monospace';x.fillText('寒光龟  SCORE '+Math.floor(score),20,35);x.textAlign='right';x.fillText('BEST '+best,W-20,35);if(over){x.fillStyle='#0008';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='900 42px sans-serif';x.fillText('寒光龟 撞了！',W/2,H*.42);x.font='bold 20px sans-serif';x.fillText('点击屏幕重新开始',W/2,H*.50)}}
function loop(t){let dt=Math.min((t-last)/16.67,2);last=t;if(started&&!over){timer+=dt;if(timer>75){spawn();timer=0}if(Math.random()<.16*dt)rain();speed+=.0015*dt;score+=.12*dt;player.vy+=.68*dt;player.y+=player.vy*dt;if(player.y>=ground-55){player.y=ground-55;player.vy=0;player.jumps=0}obs.forEach(o=>o.x-=speed*dt);poop.forEach(q=>{q.y+=q.vy*dt;q.vy+=.12*dt});obs=obs.filter(o=>o.x>-60);poop=poop.filter(q=>q.y<H+30);if(obs.some(o=>rect({x:player.x+5,y:player.y+7,w:48,h:48},o))){over=true;best=Math.max(best,Math.floor(score));localStorage.hanguangBest=best}}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
