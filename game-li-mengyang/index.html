<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>李孟洋 · 小恐龙跑酷</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:linear-gradient(#b9e9ff,#f7fbff)}body{touch-action:none}.wrap{height:100%;display:flex;align-items:center;justify-content:center}.game{position:relative;width:min(100vw,900px);height:min(70vh,430px);min-height:300px;overflow:hidden;border:3px solid #222;border-radius:18px;background:linear-gradient(#bcecff 0 65%,#dff6cf 65%);box-shadow:0 12px 40px #0002}.title{position:absolute;left:18px;top:12px;font-size:20px;font-weight:800;z-index:5}.score{position:absolute;right:18px;top:14px;font-weight:700;z-index:5}.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:700;z-index:5;pointer-events:none}.ground{position:absolute;bottom:45px;width:100%;height:4px;background:#333}.dino{position:absolute;left:9%;bottom:49px;width:52px;height:52px;font-size:45px;line-height:52px;z-index:4;filter:drop-shadow(1px 2px 0 #fff)}.ob{position:absolute;bottom:49px;font-size:32px;z-index:3}.poop{position:absolute;top:-45px;font-size:27px;z-index:2;user-select:none}.cloud{position:absolute;font-size:35px;opacity:.55}.controls{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.7;z-index:5;white-space:nowrap}.over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#fff9;z-index:10;font-weight:800;font-size:28px}.over button{margin-top:12px;padding:10px 22px;border:0;border-radius:12px;background:#222;color:#fff;font-size:16px}.label{position:absolute;left:8%;bottom:105px;font-size:12px;font-weight:800;opacity:.65}
</style></head>
<body><div class="wrap"><div class="game" id="game">
<div class="title">🦖 李孟洋 · 小恐龙跑酷</div><div class="score" id="score">00000</div><div class="hint" id="hint">点击 / 触摸屏幕开始<br>⬆️ 跳跃　⬇️ 长按下蹲</div>
<div class="cloud" style="left:25%;top:25px">☁️</div><div class="cloud" style="left:70%;top:70px">☁️</div><div class="ground"></div><div class="dino" id="dino">🦖</div><div class="label">李孟洋</div><div class="controls">点击跳跃 · 长按屏幕下方区域下蹲</div><div class="over" id="over"><div>💩 游戏结束</div><div id="final" style="font-size:18px;margin-top:6px"></div><button id="restart">再来一局</button></div>
</div></div>
<script>
const g=document.getElementById('game'),d=document.getElementById('dino'),scoreEl=document.getElementById('score'),hint=document.getElementById('hint'),over=document.getElementById('over'),final=document.getElementById('final');
let running=false,dead=false,y=0,vy=0,score=0,speed=5,last=0,spawn=0,poopSpawn=0,duck=false,best=+localStorage.liMengyangBest||0;
function jump(){if(!running){start();return} if(y<=1){vy=13}}
function start(){running=true;dead=false;score=0;speed=5;hint.style.display='none';over.style.display='none';requestAnimationFrame(loop)}
function end(){dead=true;running=false;final.textContent=`李孟洋跑了 ${Math.floor(score)} 米 · 最佳 ${best}`;over.style.display='flex'}
function makeObstacle(){let e=document.createElement('div');e.className='ob';e.textContent=Math.random()<.2?'🐦':'🌵';e.style.left='100%';g.appendChild(e);let x=g.clientWidth+20;e.dataset.x=x;e.dataset.v=String(speed+(Math.random()*2));return e}
function makePoop(){let e=document.createElement('div');e.className='poop';e.textContent='💩';e.style.left=(20+Math.random()*75)+'%';g.appendChild(e);e.dataset.y='-45';e.dataset.v=(3.2+Math.random()*2.5).toString();return e}
function collide(a,b){let A=a.getBoundingClientRect(),B=b.getBoundingClientRect();return !(A.right-8<B.left||A.left+8>B.right||A.bottom-8<B.top||A.top+8>B.bottom)}
function loop(t){if(!running)return;let dt=Math.min(32,t-last||16);last=t;score+=dt*.012;speed+=dt*.00012;scoreEl.textContent=String(Math.floor(score)).padStart(5,'0');
vy-=.65*dt/16;y+=vy*dt/16;if(y<0){y=0;vy=0}d.style.transform=`translateY(${-y}px) scaleY(${duck?.65:1})`;
spawn-=dt;if(spawn<=0){makeObstacle();spawn=850+Math.random()*900-Math.min(score*2,400)}
poopSpawn-=dt;if(poopSpawn<=0){makePoop();poopSpawn=170+Math.random()*240}
for(const e of [...g.querySelectorAll('.ob')]){let x=+e.dataset.x-+e.dataset.v*dt/16;e.dataset.x=x;e.style.left=x+'px';if(x<-60)e.remove();else if(collide(d,e)){end();return}}
for(const e of [...g.querySelectorAll('.poop')]){let yy=+e.dataset.y+ +e.dataset.v*dt/16;e.dataset.y=yy;e.style.top=yy+'px';if(yy>g.clientHeight)e.remove();else if(collide(d,e)){end();return}}
requestAnimationFrame(loop)}
g.addEventListener('pointerdown',e=>{if(e.target.id==='restart')return;duck=e.clientY>innerHeight*.72;jump()});g.addEventListener('pointerup',()=>duck=false);g.addEventListener('pointercancel',()=>duck=false);document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.code==='ArrowDown')duck=true});document.addEventListener('keyup',e=>{if(e.code==='ArrowDown')duck=false});document.getElementById('restart').onclick=()=>{location.reload()};
</script></body></html>
